<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101114">
  <title>Podcast player · Stern Archive</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="modern.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="left-cluster"><a class="nav-link" href="podcasts.html">← Podcasts</a><a class="nav-link" href="history.html">History</a></div>
      <a class="brand-wrap compact" href="index.html"><span class="brand-mark" aria-hidden="true">🎧</span><span class="brand-name">Stern Archive</span></a>
    </header>
    <main class="player-shell">
      <section class="player-panel">
        <div class="player-heading">
          <p class="eyebrow">Podcast</p>
          <h1 id="podcastTitle">Loading podcast…</h1>
          <p id="episodeCount" class="now-playing"></p>
        </div>
        <div class="player-container sticky-player">
          <p id="podcastNowPlaying" class="sticky-player-title">Choose an episode to listen</p>
          <audio id="audioPlayer" controls preload="metadata" playsinline aria-label="Podcast audio player"></audio>
        </div>
        <div id="episodeDetails" class="episode-details"></div>
        <h2 class="list-heading">Episodes</h2>
        <div id="episodes" class="episodes"></div>
      </section>
    </main>
  </div>
  <script src="listening-history.js"></script>
  <script src="podcast-player.js?v=2"></script>
  <script src="playback-recovery.js"></script>
</body>
</html>
