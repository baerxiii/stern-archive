<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101114">
  <title>Audiobook player · Stern Archive</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="modern.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="left-cluster"><a class="nav-link" href="audiobooks.html">← Audiobooks</a><a class="nav-link" href="history.html">History</a></div>
      <a class="brand-wrap compact" href="index.html"><span class="brand-mark" aria-hidden="true">🎧</span><span class="brand-name">Stern Archive</span></a>
    </header>
    <main class="player-shell">
      <section class="player-panel">
        <div class="player-heading"><p class="eyebrow">Audiobook</p><h1 id="bookTitle">Loading…</h1><p id="bookAuthor" class="now-playing"></p></div>
        <div class="player-container sticky-player">
          <label class="chapter-selector" for="chapterSelect">
            <span>Chapter</span>
            <select id="chapterSelect" disabled><option value="">Loading chapters…</option></select>
          </label>
          <p id="bookNowPlaying" class="sticky-player-title">Choose a chapter to listen</p>
          <audio id="audioPlayer" controls preload="metadata" playsinline aria-label="Audiobook audio player"></audio>
        </div>
        <div class="book-header">
          <img id="bookCover" class="book-cover" alt="Book cover" hidden>
          <p id="bookDescription" class="book-description"></p>
        </div>
        <h2 class="list-heading">Chapters</h2>
        <div id="chapters" class="chapter-list"></div>
      </section>
    </main>
  </div>
  <script src="listening-history.js"></script>
  <script src="audiobook-player.js"></script>
  <script src="playback-recovery.js"></script>
</body>
</html>
