<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101114">
  <title>Podcasts · Stern Archive</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="modern.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="left-cluster"><a class="nav-link" href="index.html">← Home</a><a class="nav-link" href="history.html">History</a></div>
      <a class="brand-wrap compact" href="index.html"><span class="brand-mark" aria-hidden="true">🎧</span><span class="brand-name">Stern Archive</span></a>
    </header>
    <main>
      <section class="toolbar">
        <div class="toolbar-intro"><p class="eyebrow">Stream from RSS feeds</p><h1>Podcasts</h1></div>
        <p>Choose a podcast to browse its episodes.</p>
        <button type="button" id="addPodcastBtn" class="primary-btn" disabled>＋ Add podcast</button>
        <div id="addPodcastPanel" class="archive-panel hidden">
          <div class="archive-panel-header"><h2>Add a podcast</h2><button type="button" id="closePodcastPanel" class="icon-btn" aria-label="Close">×</button></div>
          <form id="addPodcastForm">
            <div class="archive-form-grid">
              <label><span>Podcast name</span><input id="podcastName" type="text" required placeholder="My podcast"></label>
              <label><span>RSS feed URL</span><input id="podcastRss" type="url" required placeholder="https://example.com/feed.xml"></label>
            </div>
            <div class="archive-actions"><button type="submit" class="primary-btn">Save podcast</button><p id="podcastFormMessage" class="archive-message" role="status"></p></div>
          </form>
        </div>
      </section>
      <p id="podcastMessage" class="archive-message" role="status"></p>
      <div id="podcastList" class="library-grid"></div>
      <section class="editor-panel" aria-labelledby="editorHeading">
        <h2 id="editorHeading">Podcast editors</h2>
        <p id="authStatus" class="archive-message" role="status">Checking sign-in…</p>
        <form id="signInForm" class="editor-form" onsubmit="event.preventDefault()">
          <label><span>Email</span><input id="editorEmail" type="email" autocomplete="username" required></label>
          <label><span>Password</span><input id="editorPassword" type="password" autocomplete="current-password" required></label>
          <button type="submit" class="transport-btn">Sign in</button>
        </form>
        <button id="signOutBtn" type="button" class="transport-btn" hidden>Sign out</button>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.STERN_ARCHIVE_CONFIG = {
      supabaseUrl: "https://uzbbwvihkfzdbnowhglc.supabase.co",
      supabaseAnonKey: "sb_publishable_a6YEwdDOpkZ6BI8pHXVPnQ_WlFMlHmf"
    };
  </script>
  <script src="podcasts.js?v=2"></script>
</body>
</html>
