<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101114">
  <title>Video · Stern Archive</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="modern.css">
</head>
<body id="top">
  <div class="page-shell">
    <header class="topbar">
      <div class="left-cluster"><a class="nav-link" href="index.html">← Home</a><a class="nav-link" href="library.html">Browse Library</a></div>
      <a class="brand-wrap compact" href="index.html"><span class="brand-mark" aria-hidden="true">▶</span><span class="brand-name">Stern Archive</span></a>
    </header>
    <main>
      <section class="toolbar">
        <div class="toolbar-intro"><p class="eyebrow">Internet Archive powered</p><h1>Video archives</h1></div>
        <p>Choose an archive to browse its videos. Availability and playback are controlled by Internet Archive.</p>
        <button type="button" id="addVideoBtn" class="primary-btn" disabled>＋ Add video archive</button>
        <div id="addVideoPanel" class="archive-panel hidden">
          <div class="archive-panel-header"><h2 id="videoFormHeading">Add a video archive</h2><button type="button" id="closeVideoPanel" class="icon-btn" aria-label="Close">×</button></div>
          <form id="addVideoForm">
            <div class="archive-form-grid">
              <label><span>Archive.org item URL or ID</span><input id="videoArchiveInput" required placeholder="https://archive.org/details/..."></label>
              <label><span>Display name</span><input id="videoArchiveTitle" required placeholder="1999 video archive"></label>
              <label><span>Category</span><input id="videoArchiveCategory" list="videoCategories" placeholder="Choose or create a category"><datalist id="videoCategories"></datalist></label>
            </div>
            <a class="back-to-top" href="#top" aria-label="Back to top">↑ <span>Top</span></a>
            <div class="archive-actions"><button type="submit" class="primary-btn">Save archive</button><p id="videoFormMessage" class="archive-message" role="status"></p></div>
          </form>
        </div>
      </section>
      <p id="videoMessage" class="archive-message" role="status"></p>
      <div id="videoArchives" class="video-archive-groups"></div>
      <section id="videoBrowser" class="video-card" hidden aria-labelledby="videoArchiveHeading">
        <h2 id="videoArchiveHeading"></h2>
        <p id="videoStatus" class="archive-message" role="status"></p>
        <div id="videoEmbedContainer" class="video-frame">
          <iframe id="videoEmbed" title="Internet Archive video player" loading="lazy" allow="fullscreen; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div id="videoPlayerContainer" class="video-frame" hidden>
          <video id="videoPlayer" controls playsinline preload="metadata"></video>
        </div>
        <p id="videoNowPlaying"></p>
        <p><a id="videoSource" class="text-link" target="_blank" rel="noopener noreferrer">Open on Internet Archive ↗</a></p>
        <label for="videoSearch">Search videos</label>
        <input id="videoSearch" type="search" placeholder="Search videos...">
        <div id="videoFiles" class="episode-list"></div>
      </section>
      <section class="editor-panel" aria-labelledby="editorHeading">
        <h2 id="editorHeading">Video archive editors</h2>
        <p id="authStatus" class="archive-message" role="status">Checking sign-in…</p>
        <form id="signInForm" class="editor-form">
          <label><span>Email</span><input id="editorEmail" type="email" autocomplete="username" required></label>
          <label><span>Password</span><input id="editorPassword" type="password" autocomplete="current-password" required></label>
          <button type="submit" class="transport-btn">Sign in</button>
        </form>
        <button id="signOutBtn" type="button" class="transport-btn" hidden>Sign out</button>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.STERN_ARCHIVE_CONFIG = {
      supabaseUrl: "https://uzbbwvihkfzdbnowhglc.supabase.co",
      supabaseAnonKey: "sb_publishable_a6YEwdDOpkZ6BI8pHXVPnQ_WlFMlHmf"
    };
  </script>
  <script src="videos.js"></script>
</body>
</html>
