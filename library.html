<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="left-cluster">
        <button type="button" class="back-btn" onclick="window.history.length > 1 ? history.back() : location.href='index.html';">← Back</button>
        <a class="nav-link secondary" href="index.html">Home</a>
      </div>
      <div class="brand-wrap compact">
        <span class="brand-mark">📚</span>
        <h1>Library</h1>
      </div>
    </header>

    <div class="toolbar">
      <div class="toolbar-row">
        <input type="text" id="searchBox" placeholder="Search archive titles...">
        <button type="button" id="addArchiveBtn" class="primary-btn">Add Archive</button>
      </div>

      <div id="addArchivePanel" class="archive-panel hidden">
        <div class="archive-panel-header">
          <h2>Add an Archive</h2>
          <button type="button" id="closeArchivePanel" class="icon-btn" aria-label="Close">×</button>
        </div>

        <div class="archive-form-grid">
          <label>
            <span>Archive URL or ID</span>
            <input id="archiveInput" type="text" placeholder="https://archive.org/details/... or stern-...">
          </label>

          <label>
            <span>Title</span>
            <input id="archiveTitle" type="text" placeholder="My archive title">
          </label>

          <label>
            <span>Year</span>
            <input id="archiveYear" type="text" placeholder="2024">
          </label>
        </div>

        <div class="archive-actions">
          <button type="button" id="saveArchiveBtn" class="primary-btn">Save Archive</button>
          <p id="archiveMessage" class="archive-message" aria-live="polite"></p>
        </div>
      </div>
    </div>

    <main>
      <div id="library" class="library-grid"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.STERN_ARCHIVE_CONFIG = {
      supabaseUrl: "https://cujvvxyadxvlfvhgzlki.supabase.co",
      supabaseAnonKey: "sb_publishable_wogqNQurYqmvOx9FvoFxMQ_XyRMTxZ_"
    };
  </script>
  <script src="app.js"></script>
</body>
</html>
